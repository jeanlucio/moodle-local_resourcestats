# Each entry needs an image at docs/assets/img/screenshots/<file>, plus an
# English and a Portuguese caption. The screenshots.md pages (en/pt) loop over
# this list, so adding a new screenshot never touches the gallery markup.
- file: course-badges.png
  caption_en: "Badges below each activity on the course page: accesses, unique students, the last student who visited, and — where the activity tracks completion — how many completed and passed it"
  caption_pt: "Badges abaixo de cada atividade na página do curso: acessos, estudantes únicos, o último estudante que acessou e — nas atividades com rastreamento de conclusão — quantos concluíram e foram aprovados"
- file: course-stats-overview.png
  caption_en: "The course statistics overview: engagement and completion alerts, and a sortable table of every trackable activity. An activity that does not track completion, or has no pass mark, shows an em dash rather than a zero"
  caption_pt: "A visão geral de estatísticas do curso: alertas de engajamento e de conclusão, e uma tabela ordenável de todas as atividades rastreáveis. Atividade sem rastreamento de conclusão, ou sem nota de aprovação, exibe um travessão em vez de zero"
- file: view-stats-detail.png
  caption_en: "Per-activity detail page: each student's access count, first and last access, and their completion state — passed, did not pass, or not completed — with CSV/Excel export"
  caption_pt: "Página de detalhe por atividade: acessos, primeiro e último acesso de cada estudante e sua situação de conclusão — aprovado, não aprovado ou não concluído — com exportação para CSV/Excel"
- file: preferences.png
  caption_en: "Each teacher independently chooses which of the five badges to display"
  caption_pt: "Cada professor escolhe de forma independente quais dos cinco badges exibir"
